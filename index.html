<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="lgX" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".16" stop-color="#800000"/><stop offset=".84" stop-color="#800000"/><stop offset="1" stop-color="#F00"/></linearGradient>
    <linearGradient id="lgY" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".22" stop-color="#008000"/><stop offset=".78" stop-color="#008000"/><stop offset="1" stop-color="#0F0"/></linearGradient>
  </defs>
  <filter id="lgRefract" x="0" y="0" width="1" height="1" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feFlood x="0" y="0" width="1" height="1" flood-color="#000" result="base"/>
    <feImage x="0" y="0" width="1" height="1" preserveAspectRatio="none" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' preserveAspectRatio='none'%3E%3ClinearGradient id='a'%3E%3Cstop offset='0' stop-color='%23000'/%3E%3Cstop offset='.16' stop-color='%23800000'/%3E%3Cstop offset='.84' stop-color='%23800000'/%3E%3Cstop offset='1' stop-color='%23F00'/%3E%3C/linearGradient%3E%3Crect width='10' height='10' fill='url(%23a)'/%3E%3C/svg%3E" result="mx"/>
    <feImage x="0" y="0" width="1" height="1" preserveAspectRatio="none" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' preserveAspectRatio='none'%3E%3ClinearGradient id='b' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23000'/%3E%3Cstop offset='.22' stop-color='%23008000'/%3E%3Cstop offset='.78' stop-color='%23008000'/%3E%3Cstop offset='1' stop-color='%230F0'/%3E%3C/linearGradient%3E%3Crect width='10' height='10' fill='url(%23b)'/%3E%3C/svg%3E" result="my"/>
    <feComposite in="mx" in2="my" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="map"/>
    <feDisplacementMap id="lgDisp" in="SourceGraphic" in2="map" scale="0.06" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="app">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand"><span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span>WalletWeb</div>
    <button class="btn primary" data-act="newTx"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Nuevo movimiento</button>
    <a class="side-link" href="#inicio" data-act="go" data-v="inicio" data-tab="inicio">Inicio</a>
    <a class="side-link" href="#movimientos" data-act="go" data-v="movimientos" data-tab="movimientos">Movimientos</a>

    <a class="side-link" href="#recurrentes" data-act="go" data-v="recurrentes" data-tab="recurrentes">Recurrentes</a>
    <a class="side-link" href="#ajustes" data-act="go" data-v="ajustes" data-tab="ajustes">Ajustes</a>

  </aside>
  <div class="main">
    <header class="topbar">
      <div id="tbLeft"></div>
      <h1 id="title">WalletWeb</h1>
      <button class="icon-btn" id="gearBtn" data-act="go" data-v="ajustes" aria-label="Ajustes" hidden></button>
      <button class="icon-btn" id="privBtn" data-act="privToggle" aria-label="Modo privacidad" aria-pressed="false"></button>
      <button class="icon-btn" data-act="go" data-v="alertas" aria-label="Alertas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
    </header>
    <div id="banner"></div>
    <main id="view" tabindex="-1"><noscript>WalletWeb necesita JavaScript.</noscript></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegación"></nav>
</div>
<div id="sheets"></div>
