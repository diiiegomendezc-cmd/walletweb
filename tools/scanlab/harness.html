}
let worker = null;
async function getWorker() {

  worker = await Tesseract.createWorker('spa', 1, { workerPath: base + 'worker.min.js', corePath: base, langPath: base + 'lang', workerBlobURL: false, gzip: true });
  await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
  return worker;
}
// Mismo camino que la app: detectar → procesar → leer → interpretar
window.runScan = async (url, opts = {}) => {

  const t2 = performance.now();

    }
    out.parsed = out.parsedM || out.parsedT6;

<script>
window.dbgWS = async (url) => {
  const cv = await loadImg(url); const seg = sSegmentWS(cv, cv.width, cv.height);
  if (!seg) return null;
  const { w, h, pm } = seg; const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(cv, 0, 0, w, h); const id = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < w * h; i++) { if (pm[i]) { id.data[i * 4 + 1] = Math.min(255, id.data[i * 4 + 1] + 70); } else { id.data[i * 4] *= 0.5; id.data[i * 4 + 1] *= 0.5; id.data[i * 4 + 2] *= 0.5; } }

  const q = sQuadFromMask(pm, w, h); const lq = q ? sQuadLines(pm, w, h, q.q) : null;
  return { png: c.toDataURL('image/png'), q: q && q.q, lq: lq && lq.q, blobA: seg.blobA, seedA: seg.seedA, area: seg.area, w, h };

<script>
window.stages = async (url) => {
  const cv = await loadImg(url); const a = scanAutoDetect(cv); const quad = a.quad, curve = a.curve;

  const sh = c => { const s = sInkSmall(c, 300); return sRowSharpness(s.ink, s.Wd, s.Hd, null); };

  return { quad, curveMax: Math.max(...['t','r','b','l'].flatMap(k => curve[k].map(Math.abs))), shC, shF, angle: dk.angle, passes, w: sm(warped), l: sm(level), s: sm(st) };

<script>
// Reconstruye renglones a partir de las palabras con su posición (tolera montos un poco más arriba o abajo)
function linesFromWords(words) {
  const ws = words.filter(w => w.text && w.text.trim()).map(w => ({ t: w.text.trim(), x0: w.bbox.x0, x1: w.bbox.x1, y0: w.bbox.y0, y1: w.bbox.y1, yc: (w.bbox.y0 + w.bbox.y1) / 2 }));
  if (!ws.length) return [];
  const hs = ws.filter(w => w.t.length >= 2).map(w => w.y1 - w.y0).sort((a, b) => a - b), H = hs[hs.length >> 1] || 20;
  ws.sort((a, b) => a.yc - b.yc);
  const rows = [];
  for (const w of ws) {
    let best = null, bd = 1e9;
    for (const r of rows) { const dy = Math.abs(r.yc - w.yc); if (dy < H * 0.55 && dy < bd && !r.ws.some(o => !(w.x1 < o.x0 || w.x0 > o.x1))) { bd = dy; best = r; } }
    if (best) { best.ws.push(w); best.yc = best.ws.reduce((s, o) => s + o.yc, 0) / best.ws.length; } else rows.push({ yc: w.yc, ws: [w] });
  }
  rows.sort((a, b) => a.yc - b.yc);
  return rows.map(r => r.ws.sort((a, b) => a.x0 - b.x0).map(w => w.t).join(' '));
}
window.ocrGeo = async (url, psm) => { const w = await getWorker(); await w.setParameters({ tessedit_pageseg_mode: String(psm) }); const t0 = performance.now(); const { data } = await w.recognize(url, {}, { text: true, blocks: true }); await w.setParameters({ tessedit_pageseg_mode: '6' });
  const words = ocrWords(data); const lines = linesFromWords(words); return { ms: Math.round(performance.now() - t0), lines, parsed: C.parseReceiptText(lines.join('\n')), parsedT: C.parseReceiptText(data.text) }; };
</script>
<script>

  let cnt = 0; for (let i = 0; i < n; i++) { const r = Math.min(255, d[i*4]*g[0]), gg = Math.min(255, d[i*4+1]*g[1]), b = Math.min(255, d[i*4+2]*g[2]); if (sIsSkin(r, gg, b) || sIsWarm(r, gg, b)) { id.data[i*4] = 255; id.data[i*4+1] = 0; id.data[i*4+2] = 255; cnt++; } }
